<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
</head>

<body>
<a-scene
  mindar-image="imageTargetSrc: https://bossu29.github.io/targets2.mind; maxTrack: 5;"
  
  vr-mode-ui="enabled: false"
  
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="model0" src="https://bossu29.github.io/undertale_-_greater_dog.glb"></a-asset-item>
    <a-asset-item id="model1" src="https://Grace1987-pixel.github.io/toon_cat_free.glb"></a-asset-item>
    <a-asset-item id="model2" src="https://montakan004.github.io/bird_orange.glb"></a-asset-item>
  </a-assets>

  <!-- Target 1 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#model0" animation-mixer rotation="90 0 0" scale="1 1 1"></a-gltf-model>
  </a-entity>

  <!-- Target 2 -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#model1" animation-mixer rotation="90 0 0" scale="1 1 1"></a-gltf-model>
  </a-entity>

  <!-- Target 3 -->
  <a-entity mindar-image-target="targetIndex: 2">
    <a-gltf-model src="#model2" animation-mixer rotation="0 0 0" scale="1 1 1"></a-gltf-model>
  </a-entity>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

</a-scene>
</body>
</html>
